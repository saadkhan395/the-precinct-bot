name: Schedule Approved Content

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs every 15 minutes.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: daily-precinct-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scheduler dependencies
        run: pip install gspread google-auth pyyaml

      - name: Schedule approved content
        run: python src/scheduling/schedule_content.py
        env:
          PYTHONPATH: src
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULE_TIMEZONE: ${{ vars.SCHEDULE_TIMEZONE }}
