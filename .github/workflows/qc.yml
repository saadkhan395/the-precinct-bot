name: Quality Check

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */2 * * *"

permissions:
  contents: read

concurrency:
  group: daily-precinct-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Fonts (with timeout and retries)
        timeout-minutes: 3
        run: |
          APT_RESILIENCE="-o Acquire::http::Timeout=30 -o Acquire::Retries=3"
          sudo apt-get $APT_RESILIENCE update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_RESILIENCE install -y -qq --no-install-recommends fonts-dejavu-core

      - run: pip install requests feedparser pyyaml gspread google-auth groq pillow

      - run: python src/qc/run_qc.py
        env:
          PYTHONPATH: src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
