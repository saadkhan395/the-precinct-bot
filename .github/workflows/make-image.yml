name: Make Image Post
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install requests feedparser pyyaml gspread google-auth groq pillow
      - run: python src/generate/make_image_post.py
        env:
          PYTHONPATH: src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}  <-- ADD THIS LINE
      - name: Save image to repo
        run: |
          git config user.name "daily-present-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/images
          if ! git diff --cached --quiet; then
            git commit -m "Add generated image post"
            git pull --rebase origin main
            git push
          fi
