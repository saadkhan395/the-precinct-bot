name: Research News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests feedparser pyyaml gspread google-auth
      - run: python src/research/run_research.py
        env:
          PYTHONPATH: src
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
