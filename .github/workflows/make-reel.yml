name: Make Reel Post
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 2,4"

permissions:
  contents: write

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Fonts
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fonts-dejavu-core

      - run: pip install requests feedparser pyyaml gspread google-auth groq pillow

      - run: python src/generate/make_reel_post.py
        env:
          PYTHONPATH: src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Save video to repo
        run: |
          git config user.name "daily-precinct-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/reels output/audio
          if ! git diff --cached --quiet; then
            git commit -m "Add generated reel"
            git pull --rebase origin main
            git push
          fi
