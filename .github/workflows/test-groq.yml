name: Test Groq
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install groq
      - run: python src/utils/test_groq.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
